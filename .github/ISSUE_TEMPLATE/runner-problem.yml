name: Thor runner problem
description: The shared self-hosted runner pool (CT 144, label `thor`) collides, starves or changed under you.
title: "[runner] "
labels: ["runner"]
body:
  - type: input
    id: repo
    attributes:
      label: Calling repository
      description: Also add the matching `from:<repo>` label.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - port collision between concurrent jobs
        - Docker container or volume name collision / prune
        - shared cache or home directory (uv, ~/.ansible, …)
        - toolcache / interpreter changed (e.g. a new Python)
        - queueing / capacity
        - other
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Failing run URL(s)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Runner name, the colliding job if known, and the log lines.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Local workaround, if any
      description: Must carry `# upstream: airia-ci#<this issue>`.
