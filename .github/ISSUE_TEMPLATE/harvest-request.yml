name: Harvest request
description: A CI job, action or script exists (or is needed) in two or more repositories and belongs here, once.
title: "[harvest] "
labels: ["harvest"]
body:
  - type: textarea
    id: donors
    attributes:
      label: Donors
      description: Each repository and the file path of its copy (at least two, or one plus the repository that needs it now).
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Capability and inputs
      description: What the shared job does and the inputs that differ between donors (they become the job's inputs).
    validations:
      required: true
  - type: input
    id: first_adopter
    attributes:
      label: First adopter
      description: The repository that deletes its copy in the same week the shared one ships.
    validations:
      required: true
