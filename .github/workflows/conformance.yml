name: conformance

# Every consumer against the AIRIA standard, weekly: scripts/consumers.py
# --conformance keeps one "airia-ci standard drift" issue in each consumer
# that falls short of it, and closes it once nothing drifts. It reads private
# repositories of two owners and their rulesets, and writes their issues,
# which this repository's GITHUB_TOKEN cannot: it needs CONFORMANCE_TOKEN, a
# token with read access to contents and administration and write access to
# issues on every consumer. Without it the run fails and says so, rather than
# reporting a clean scan it never made.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the conformance token
        env:
          HAS_TOKEN: ${{ secrets.CONFORMANCE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=No conformance token::the CONFORMANCE_TOKEN secret is not set, so no consumer was scanned. It needs contents and administration read and issues write on every consumer of both owners."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Scan every consumer and keep its drift issue
        env:
          GH_TOKEN: ${{ secrets.CONFORMANCE_TOKEN }}
        run: |
          set -o pipefail  # drift exits 1, and the scan must not go green through tee
          pyyaml="$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["harness"]["pyyaml"])')"
          uv run --no-project --with "pyyaml==${pyyaml}" python3 scripts/consumers.py --conformance \
            AIRIA-Systems-GmbH tumma72 | tee -a "$GITHUB_STEP_SUMMARY"
