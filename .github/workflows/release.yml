name: release

# Points a consumer tag at main's head: `move` moves the newest ci-vN (a
# compatible change), `new` creates ci-v(N+1) (a change to a call contract).
# Only from main, only for a commit whose self-test run succeeded, and a move
# only forward: consumers must never lose a commit they already run. Every
# consumer runs the tag the moment it moves, so this is dispatched by a
# maintainer, by hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: move the newest ci-vN, or create the next one
        required: true
        type: choice
        options: [move, new]

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the tag
      actions: read # find this commit's self-test run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Point the tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error title=Not main::a consumer tag only ever points at main; this run is on ${GITHUB_REF}"
            exit 1
          fi
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow self-test.yml --commit "${SHA}" \
            --status success --json databaseId --jq 'length')"
          if [ "${passed}" = "0" ]; then
            echo "::error title=Not tested::self-test has not succeeded for ${SHA}"
            exit 1
          fi
          # Only ci-vN is a release: a stray ci-vnext or ci-v3-rc must never be taken for the newest.
          latest="$(git tag -l 'ci-v*' | grep -E '^ci-v[0-9]+$' | sort -V | tail -n 1)"
          if [ -z "${latest}" ]; then
            echo "::error title=No release tag::no ci-vN tag exists; create the first one by hand"
            exit 1
          fi
          old="$(git rev-parse "${latest}^{commit}")"
          case "${BUMP}" in
            move)
              tag="${latest}"
              if ! git merge-base --is-ancestor "${latest}" "${SHA}"; then
                echo "::error title=Not forward::${latest} is not an ancestor of ${SHA}; moving it would drop commits its consumers run"
                exit 1
              fi
              ;;
            new) tag="ci-v$(( ${latest#ci-v} + 1 ))" ;;
            *) echo "::error::bump must be move or new, not ${BUMP}"; exit 1 ;;
          esac
          # Each reusable workflow names its own major, to tell a frozen caller a
          # newer one exists. Under the wrong tag it would tell ci-vN's own callers
          # to upgrade to ci-vN, on every review.
          for f in .github/workflows/reusable-claude-review.yml .github/workflows/reusable-claude-respond.yml; do
            have="$(git show "${SHA}:${f}" | sed -n 's/^ *HARNESS_MAJOR: "\([0-9]*\)"$/\1/p')"
            if [ "${have}" != "${tag#ci-v}" ]; then
              echo "::error title=Wrong HARNESS_MAJOR::${f} says HARNESS_MAJOR '${have}' but this release is ${tag}; set it (and TAG in scripts/init.py, and the @ci-vN pins) to ${tag#ci-v} first"
              exit 1
            fi
          done
          git tag -f "${tag}" "${SHA}"
          git push -f origin "refs/tags/${tag}"
          echo "${tag} now points at ${SHA}" | tee -a "${GITHUB_STEP_SUMMARY}"
          # Each release is a GitHub Release under its own fixed tag (ci-v3.4):
          # whoever watches this repository's Releases is notified, and the notes
          # list what consumers now run. ci-vN.M is never taken for the newest above.
          n="$(git tag -l "${tag}.*" | grep -cE "^${tag}\.[0-9]+$" || true)"
          release="${tag}.$(( n + 1 ))"
          {
            echo "\`${tag}\` now points at ${SHA}. Since ${latest} was at ${old:0:7}:"
            echo
            git log --no-merges --format='- %s' "${old}..${SHA}"
          } > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${release}" --repo "${GITHUB_REPOSITORY}" --target "${SHA}" \
            --title "${release}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          echo "Release ${release} published" | tee -a "${GITHUB_STEP_SUMMARY}"
