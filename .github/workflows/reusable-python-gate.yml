name: AIRIA Python gate (shared)

# ─────────────────────────────────────────────────────────────────────────────
# THE AIRIA QUALITY STANDARD for a Python repository: one workflow file in the
# caller, the same gates everywhere, at the versions in pins.toml. A project
# may ADD to it (a higher floor, more Pythons, its own jobs fed into `gate`);
# there is no input that switches a gate off. The caller's whole merge gate:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     push:
#       branches: [main]
#   permissions: {}
#   jobs:
#     ci:
#       permissions: { contents: read, pull-requests: write, issues: write, actions: read, checks: read }
#       uses: AIRIA-Systems-GmbH/airia-ci/.github/workflows/reusable-python-gate.yml@ci-v5
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# THE REQUIRED CHECKS are `ci / gate` and `ci / claude-review / claude-review`
# (GitHub names a called job `<caller job> / <called job>`). `init.py protect`
# writes them into the ruleset from the caller's own job name.
#
# THE GATES, each a job on the caller's runner, each from a clean checkout
# through the python-toolchain action (uv and Python from `.python-version`,
# `uv sync --locked`, uv.lock and every workflow step checked against the pins):
#   lint      ruff check, ruff format --check, the ruff floor (the template's
#             `select`, which a project may extend, never narrow) and its
#             `# noqa` baseline (.airia/ruff-baseline.json, which may only
#             fall), the type checker (pyright, or mypy --strict where
#             pins.toml allows it), and import-linter when pyproject.toml has
#             [tool.importlinter];
#   test      pytest, once per Python, with the project's own `--cov=…`; the
#             JSON report must exist and reach `coverage-floor` (a `--no-cov`
#             in addopts writes none, and fails); it always prints the
#             `durations` slowest tests (25 by default; 0 prints all), so a
#             slow suite can be profiled from its CI log;
#   security  reuse lint, pip-audit over the locked requirements, gitleaks over
#             the tree, zizmor over .github/ (offline, the standard's policy);
#   gate      needs every one of them and the caller's `extra-jobs`; red unless
#             each one succeeded. A skipped gate is a failed gate, with one
#             exception, below.
#
# THE DOCS-ONLY FAST PATH, opt-in. `changes` decides whether a PR touched
# code. With `docs-paths` empty (the default) the answer is always yes and
# every gate runs, as before. With it set (git glob pathspecs, one per line or
# space-separated, e.g. `docs/**` and `**/*.md`), a pull request whose every
# changed path matches one is docs-only: `lint` and `test` are skipped, and
# `gate` accepts exactly those two skips because `changes` said `code` is
# `false`. `security` still runs (REUSE, gitleaks: a doc needs its licence
# and must not leak a secret), and so does every extra job. A rename counts
# both its old and its new path, an empty diff counts as code, and any event
# but a pull request (a push to the default branch) runs everything. Some paths
# are never docs, whatever the patterns say: `.airia/` (suites read it),
# `.github/`, any `tests/` or `test/` directory, Python sources, and the files
# that configure the tools or the build (any `*.toml`, `uv.lock`,
# `.python-version`, `setup.cfg`, `*.ini`, `.importlinter`, `.coveragerc`,
# `requirements*.txt`, `Dockerfile*`).
# Then the automatic Claude review, chained after `gate` and run even when it
# is red (a red gate is review input). On a PR it never skips silently: no
# Claude credential fails it with the reason.
#
# EXTRA JOBS. A called workflow cannot `needs:` the caller's jobs, so the
# caller makes its call job wait for them and hands their results in:
#
#     ci:
#       needs: [e2e]
#       if: always()
#       uses: …/reusable-python-gate.yml@ci-v5
#       with:
#         extra-jobs: ${{ toJSON(needs) }}
#
# Without `if: always()` a red extra job skips the whole call: `ci / gate`
# then never reports, and the PR waits on it rather than merging.
#
# SERVICES. A reusable workflow cannot take a `services:` block, so the test
# job has two slots, started only when their image is set: Postgres-compatible
# (`postgres-image`, user/password/database `postgres`) and Qdrant. Their
# addresses are CI_POSTGRES_DSN and CI_QDRANT_URL; `job-env` maps them (and
# any other KEY=VALUE) onto the project's own names, as in the respond workflow.
#
# VERSIONING. The gates and the review ship together under one tag; this file
# calls the actions and the review at the same tag it is called at.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      type-checker:
        description: "`pyright` (the standard) or `mypy-strict` (only where pins.toml allows it)."
        required: false
        type: string
        default: pyright
      coverage-floor:
        description: The total coverage pytest must reach; refused under the standard's 90.
        required: false
        type: number
        default: 90
      python-versions:
        description: >-
          The Pythons to test on, as a JSON array from pins.toml's allowed list
          (e.g. '["3.12", "3.13"]'). Empty: the one in `.python-version`.
        required: false
        type: string
        default: ""
      paths:
        description: The paths ruff and the type checker check, space-separated.
        required: false
        type: string
        default: "."
      extra-jobs:
        description: "`toJSON(needs)` of the call job: the caller's own gate jobs, each of which must succeed."
        required: false
        type: string
        default: "{}"
      postgres-image:
        description: A Postgres-compatible image for the test job; empty starts none.
        required: false
        type: string
        default: ""
      qdrant-image:
        description: A Qdrant image for the test job; empty starts none.
        required: false
        type: string
        default: ""
      job-env:
        description: KEY=VALUE lines for the test job; a value may name $CI_POSTGRES_DSN or $CI_QDRANT_URL.
        required: false
        type: string
        default: ""
      runner:
        description: >-
          The runs-on labels, as a JSON array. The default is the AIRIA Thor pool,
          which serves only the organization's private repositories; a public one,
          or any outside the organization, passes '["ubuntu-24.04"]'.
        required: false
        type: string
        default: '["self-hosted","linux","x64","thor"]'
      durations:
        description: >-
          How many of the slowest tests pytest lists after every run
          (`--durations=N`; 0 lists all). The report is always printed.
        required: false
        type: number
        default: 25
      docs-paths:
        description: >-
          Git glob pathspecs (one per line or space-separated) of documentation.
          A pull request that changes only these skips lint and test, and `gate`
          passes on the rest. Empty (the default): every gate always runs.
        required: false
        type: string
        default: ""
      extra-allow:
        description: The review's extra permission-allow rules (see reusable-claude-review.yml).
        required: false
        type: string
        default: ""
      extra-deny:
        description: The review's extra permission-deny rules (see reusable-claude-review.yml).
        required: false
        type: string
        default: ""
      extra-prompt:
        description: Repository-specific sentences for the review's prompt.
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  changes:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request' && inputs.docs-paths != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
      - name: Did the change touch code
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          DOCS_PATHS: ${{ inputs.docs-paths }}
        run: |
          code=true
          read -ra patterns <<< "$(tr '\n' ' ' <<< "$DOCS_PATHS")"
          if [ "$EVENT" != pull_request ] || [ "${#patterns[@]}" -eq 0 ]; then
            echo "Every gate runs: no docs-paths, or not a pull request ($EVENT)."
          elif ! git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            echo "::notice title=Every gate runs::the checkout is not the PR's merge commit, so its change cannot be read"
          else
            # --no-renames: a moved file counts at its old path and at its new one.
            changed="$(git diff --no-renames --name-only 'HEAD^1' HEAD)"
            excluded=()
            for p in "${patterns[@]}"; do
              excluded+=(":(glob,exclude)$p")
            done
            not_docs="$(git diff --no-renames --name-only 'HEAD^1' HEAD -- . "${excluded[@]}")"
            # Never docs, whatever docs-paths says.
            always_code=(.airia .github '**/tests/**' '**/test/**' '**/*.py' '**/*.pyi' '**/*.toml' '**/uv.lock'
              '**/.python-version' '**/setup.cfg' '**/*.ini' '**/.importlinter' '**/.coveragerc'
              '**/requirements*.txt' '**/Dockerfile*')
            never="$(git diff --no-renames --name-only 'HEAD^1' HEAD -- "${always_code[@]/#/:(glob)}")"
            if [ -z "$changed" ]; then
              echo "Every gate runs: the pull request changes no file."
            elif [ -n "$not_docs$never" ]; then
              echo "Every gate runs: these changed paths are not docs:"
              printf '%s\n' "$not_docs" "$never" | sort -u | sed '/^$/d; s/^/  /'
            else
              code=false
              echo "Docs only: lint and test are skipped. Changed:"
              while IFS= read -r f; do echo "  $f"; done <<< "$changed"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: AIRIA-Systems-GmbH/airia-ci/.github/actions/python-toolchain@ci-v5
        with:
          type-checker: ${{ inputs.type-checker }}
          coverage-floor: ${{ inputs.coverage-floor }}
          tools: ${{ inputs.type-checker == 'pyright' && 'ruff pyright' || 'ruff' }}
      - name: Ruff
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          read -ra paths <<< "$PATHS"
          status=0
          ruff check "${paths[@]}" || status=1
          ruff format --check "${paths[@]}" || status=1
          exit "$status"
      - name: Ruff floor and suppressions
        env:
          PATHS: ${{ inputs.paths }}
        run: python3 "$AIRIA_TOOLCHAIN" ruff
      - name: Type check
        env:
          PATHS: ${{ inputs.paths }}
          TYPE_CHECKER: ${{ inputs.type-checker }}
        run: |
          read -ra paths <<< "$PATHS"
          case "$TYPE_CHECKER" in
            pyright) pyright --pythonpath "$PWD/.venv/bin/python" "${paths[@]}" ;;
            mypy-strict) mypy --strict "${paths[@]}" ;;
            *) echo "::error title=AIRIA standard::no type checker $TYPE_CHECKER"; exit 1 ;;
          esac
      - name: Import contracts
        run: |
          if [ -f .importlinter ] || grep -q '^\[tool\.importlinter\]' pyproject.toml; then
            lint-imports
          else
            echo "No import-linter contracts in this repository."
          fi

  test:
    name: test ${{ matrix.python || '(.python-version)' }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions != '' && inputs.python-versions || '[""]') }}
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: ${{ inputs.qdrant-image }}
        ports:
          - 6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a suite may read past commits, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - uses: AIRIA-Systems-GmbH/airia-ci/.github/actions/python-toolchain@ci-v5
        with:
          python-version: ${{ matrix.python }}
          type-checker: ${{ inputs.type-checker }}
          coverage-floor: ${{ inputs.coverage-floor }}
          services: ${{ toJSON(job.services) }}
          job-env: ${{ inputs.job-env }}
      - name: Pytest at the coverage floor
        env:
          FLOOR: ${{ inputs.coverage-floor }}
          DURATIONS: ${{ inputs.durations }}
        run: |
          if ! [[ "$DURATIONS" =~ ^[0-9]+$ ]]; then
            echo "::error title=durations::durations must be a whole number of tests to list (0 lists all), not '$DURATIONS'"
            exit 1
          fi
          report="$RUNNER_TEMP/coverage.json"
          rm -f "$report"
          pytest "--durations=$DURATIONS" --cov-report=term-missing "--cov-report=json:$report" "--cov-fail-under=$FLOOR"
          if [ ! -s "$report" ]; then
            echo "::error title=No coverage figure::pytest wrote no coverage report, so the ${FLOOR}% floor cannot be held. Measure the package in pyproject.toml ([tool.pytest.ini_options] addopts = \"--cov=<package>\") and remove any --no-cov."
            exit 1
          fi
          jq -e --argjson floor "$FLOOR" '.totals.percent_covered >= $floor' "$report" > /dev/null

  security:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: AIRIA-Systems-GmbH/airia-ci/.github/actions/python-toolchain@ci-v5
        with:
          type-checker: ${{ inputs.type-checker }}
          coverage-floor: ${{ inputs.coverage-floor }}
          tools: reuse pip-audit zizmor gitleaks
          sync: "false"
      - name: Licences (REUSE)
        run: reuse lint
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          pip-audit --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Secrets in the tree
        run: gitleaks dir --redact --no-banner .
      - name: Workflow security
        run: zizmor --offline --config "$ZIZMOR_CONFIG" .github

  gate:
    needs: [changes, lint, test, security]
    if: always()
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every gate succeeded
        env:
          OWN: ${{ toJSON(needs) }}
          EXTRA: ${{ inputs.extra-jobs }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if ! jq -e 'type == "object"' <<< "$EXTRA" > /dev/null 2>&1; then
            echo "::error title=extra-jobs::extra-jobs must be toJSON(needs) of the call job, a JSON object; got: $EXTRA"
            exit 1
          fi
          # The caller's jobs are prefixed, so one called `lint` cannot hide this workflow's.
          all="$(jq -n --argjson own "$OWN" --argjson extra "$EXTRA" '$own + ($extra | with_entries(.key |= "extra: " + .))')"
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$all" | tee -a "$GITHUB_STEP_SUMMARY"
          # Docs only (changes said so, and changes itself succeeded): lint and
          # test were skipped on purpose. Any other skip, and any failure, fails.
          skippable='[]'
          if [ "$CODE" = false ]; then
            skippable='["lint", "test"]'
            echo "Docs only: lint and test were not run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          failed="$(jq -r --argjson skip "$skippable" 'to_entries[]
            | select(.value.result != "success" and (.value.result == "skipped" and (.key | IN($skip[]))) == false)
            | "\(.key): \(.value.result)"' <<< "$all")"
          if [ -n "$failed" ]; then
            while IFS= read -r line; do
              echo "::error title=Gate not passed::$line"
            done <<< "$failed"
            exit 1
          fi

  claude-review:
    needs: [gate]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
    uses: AIRIA-Systems-GmbH/airia-ci/.github/workflows/reusable-claude-review.yml@ci-v5
    with:
      pr-number: ${{ github.event.pull_request.number }}
      runner: ${{ inputs.runner }}
      extra-allow: ${{ inputs.extra-allow }}
      extra-deny: ${{ inputs.extra-deny }}
      extra-prompt: ${{ inputs.extra-prompt }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
