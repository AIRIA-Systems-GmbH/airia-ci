name: Verified commit
description: >-
  Commit the working-tree change to an existing branch through GitHub's
  createCommitOnBranch API, as the AIRIA CI GitHub App. GitHub signs the commit
  server-side, so it is Verified with no signing key on the runner. The local
  ref is then fast-forwarded to it; nothing is ever force-pushed.

# WHY AN API COMMIT. A commit signed on the runner needs a private signing key
# there, and the operator's 1Password signer is not on a runner. A commit made
# by createCommitOnBranch is signed by GitHub itself.
#
# WHY AN APP TOKEN, not the job's GITHUB_TOKEN. An API commit made with
# GITHUB_TOKEN is Verified too, but GitHub starts no workflow for an event that
# GITHUB_TOKEN caused: a bump PR committed that way never runs its merge gate.
# The App's installation token does trigger it. The commit's author is the
# App's bot account (`<app-slug>[bot]`).
#
# WHAT IT CAN EXPRESS. createCommitOnBranch takes whole-file additions and
# deletions against an expected head, nothing else. So this action REFUSES —
# before calling it — a change that adds a symlink or submodule or changes a
# file mode, and a local branch that is not exactly the remote head (local
# commits, or a remote that moved). A rename is sent as delete + add. After
# the commit, `git status` must be clean for the committed paths: that is the
# proof the remote commit is byte-for-byte the local change.
#
# NEVER FORCE. `expectedHeadOid` is the remote head the change was built on;
# GitHub rejects the commit if the branch moved. Locally, the ref only moves
# to a commit that has the old HEAD as its ancestor.
#
# The caller needs a checkout whose `origin` can fetch (actions/checkout's
# default persisted credentials), and the branch must already exist remotely.
# Setup, secrets and the post-setup test: verified-commit.md beside this file.

inputs:
  client-id:
    description: The GitHub App's Client ID (`vars.AIRIA_CI_APP_CLIENT_ID`). Not needed for a dry run.
    required: false
    default: ""
  private-key:
    description: The GitHub App's private key (`secrets.AIRIA_CI_APP_PRIVATE_KEY`). Not needed for a dry run.
    required: false
    default: ""
  message:
    description: The commit message; its first line is the headline.
    required: true
  branch:
    description: >-
      The remote branch to commit to. Default: the checked-out branch. On a
      detached HEAD (a PR checkout) it must be given, and HEAD must equal its
      remote head.
    required: false
    default: ""
  paths:
    description: >-
      Pathspecs to commit, one per line. Default: every change in the working
      tree, as `git add -A` would stage it (untracked files included,
      .gitignore respected).
    required: false
    default: ""
  dry-run:
    description: >-
      `true`: package the change and print what would be committed, without
      minting a token or calling the API. The payload is written to
      $RUNNER_TEMP/verified-commit-payload.json.
    required: false
    default: "false"

outputs:
  committed:
    description: "`true` when a commit was created (never on a dry run or an empty change)."
    value: ${{ steps.commit.outputs.committed }}
  sha:
    description: The new commit's SHA.
    value: ${{ steps.commit.outputs.sha }}
  verified:
    description: "`true` when GitHub reports the new commit's signature as verified."
    value: ${{ steps.commit.outputs.verified }}

runs:
  using: composite
  steps:
    - name: Mint the App token
      id: app-token
      if: inputs.dry-run != 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        # this repository only, and only what a commit needs
        repositories: ${{ github.event.repository.name }}
        permission-contents: write

    - name: Commit through the API
      id: commit
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: ${{ github.repository }}
        MESSAGE: ${{ inputs.message }}
        BRANCH: ${{ inputs.branch }}
        PATHS: ${{ inputs.paths }}
        DRY_RUN: ${{ inputs.dry-run }}
        PAYLOAD: ${{ runner.temp }}/verified-commit-payload.json
      run: bash "$GITHUB_ACTION_PATH/commit.sh"
