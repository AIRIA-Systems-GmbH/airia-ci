name: Verified commit
description: >-
  Commit the job's working-tree changes to a branch as a GitHub-signed
  ("Verified") commit, authored by the AIRIA commit App, with no signing key
  on the runner. Repository-agnostic.

# WHY. Automated bump commits were signed with a human's 1Password SSH key,
# which refuses whenever the app is locked; CryptoStudio's release bumps #222
# and #224 landed unsigned that way. GitHub signs a commit made through the
# `createCommitOnBranch` mutation when the caller is a GitHub App and sends no
# author, committer or signature, so the key moves to GitHub.
#
# WHY AN APP, NOT GITHUB_TOKEN. A push made with the job's GITHUB_TOKEN starts
# no workflow, so a bump PR built with it would never run its merge gate. An
# App installation token does.
#
# THE TOKEN is minted here, for the target repository only, with
# `contents: write` only — whatever else the App may do. The private key never
# reaches the script; the token is revoked when the job ends.
#
# LIMITS of the mutation, refused rather than silently mangled: it cannot
# write a symlink or set a file mode, so a symlink or an executable file in the
# change set fails the step before anything is written. The commit lands on top
# of `expected-head` (default: the checkout's HEAD) or not at all: if the
# branch has moved, the API refuses it and the step fails.
#
#   - uses: AIRIA-Systems-GmbH/airia-ci/.github/actions/verified-commit@ci-v3
#     with:
#       client-id: ${{ vars.AIRIA_COMMIT_APP_CLIENT_ID }}
#       private-key: ${{ secrets.AIRIA_COMMIT_APP_PRIVATE_KEY }}
#       branch: release/bump-${{ inputs.version }}
#       message: "chore(release): bump version to ${{ inputs.version }}"

inputs:
  client-id:
    description: The AIRIA commit App's client ID (a repository or organization variable).
    required: true
  private-key:
    description: The App's private key (a secret).
    required: true
  branch:
    description: The branch to commit to; created at `expected-head` if it does not exist.
    required: true
  message:
    description: The commit message. Its first line is the headline.
    required: true
  paths:
    description: >-
      Files to commit, one per line, relative to the repository root. Empty
      (the default) commits every change `git status` reports, deletions and
      renames included.
    required: false
    default: ""
  expected-head:
    description: The commit the change was made on. Defaults to the checkout's HEAD.
    required: false
    default: ""
  repository:
    description: OWNER/NAME. Defaults to the calling repository.
    required: false
    default: ${{ github.repository }}
  working-directory:
    description: Any directory inside the checkout.
    required: false
    default: "."

outputs:
  sha:
    description: The new commit.
    value: ${{ steps.commit.outputs.sha }}
  url:
    description: The new commit's URL.
    value: ${{ steps.commit.outputs.url }}
  verified:
    description: "`true` — the step fails otherwise."
    value: ${{ steps.commit.outputs.verified }}

runs:
  using: composite
  steps:
    - name: Split the repository name
      id: repo
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
        echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

    - name: Mint a contents-only App token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.repo.outputs.owner }}
        repositories: ${{ steps.repo.outputs.name }}
        permission-contents: write

    - name: Commit through the API
      id: commit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
        MESSAGE: ${{ inputs.message }}
        PATHS: ${{ inputs.paths }}
        EXPECTED_HEAD: ${{ inputs.expected-head }}
      run: |
        args=(--repo "$REPOSITORY" --branch "$BRANCH" "--message=$MESSAGE")
        [ -n "$EXPECTED_HEAD" ] && args+=(--expected-head "$EXPECTED_HEAD")
        if [ -n "$PATHS" ]; then
          mapfile -t files < <(printf '%s\n' "$PATHS" | sed '/^[[:space:]]*$/d')
          args+=(--paths "${files[@]}")
        fi
        python3 "$GITHUB_ACTION_PATH/verified_commit.py" "${args[@]}"
