name: CI results for Claude
description: >-
  Download every completed job of one workflow run — conclusion, per-step
  conclusions and full log — into a directory, so a Claude job reads the merge
  gate's own results instead of re-running the gates. Repository-agnostic.

# Logs come from the jobs API (`actions/jobs/<id>/logs`), never
# `gh run view --job <id> --log`: that one resolves the job by NAME inside the
# run's archive and can hand back a different job's log.
#
# `--allow-escape-sequences` is passed only when this gh has it. Recent gh
# writes NOTHING for a log carrying terminal escapes without it; the gh 2.46
# on the Thor pool rejects it as an unknown flag. Passing it blind emptied
# every log on PR #741's first run, and the reviewer caught it — so a log that
# cannot be fetched now says why, and jobs.md counts it, rather than failing quiet.

inputs:
  run-id:
    description: The workflow run whose jobs to collect. Empty collects nothing.
    required: true
  out-dir:
    description: Where to write jobs.md and logs/.
    required: true
  github-token:
    description: "A token with `actions: read`, and `checks: read` to tell a job that hit its timeout-minutes from one cancelled."
    required: true

outputs:
  collected:
    description: Number of completed jobs whose results were written.
    value: ${{ steps.collect.outputs.collected }}

runs:
  using: composite
  steps:
    - name: Collect the run's job results
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.run-id }}
        OUT: ${{ inputs.out-dir }}
      run: |
        mkdir -p "$OUT/logs"
        index="$OUT/jobs.md"
        if [ -z "$RUN_ID" ]; then
          echo "No CI run was found for this commit: there are no CI results to read." > "$index"
          echo "collected=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
        # A 5xx is GitHub's, not the run's: one `HTTP 502` on the listing lost a
        # whole run's results (Issue #54). So a 5xx is asked again, with a growing
        # pause, CI_RESULTS_ATTEMPTS times in all; any other error is final at once.
        # Each attempt's `>` empties jobs.tsv and jobs.err: --paginate can have
        # written some pages before it failed, and the head_sha read appends.
        # A knob that is not a plain number takes its default: `three` would retry
        # forever, and `1s` would end the step in an arithmetic error.
        list_jobs() {
          local attempt=1 attempts="${CI_RESULTS_ATTEMPTS:-}" backoff="${CI_RESULTS_RETRY_SLEEP:-}"
          case "$attempts" in ''|*[!0-9]*) attempts=3 ;; esac
          case "$backoff" in ''|*[!0-9]*) backoff=10 ;; esac
          until gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest" \
               --jq '.jobs[] | select(.status == "completed")
                     | [.id, .name,
                        # No step ever started: no runner picked the job up, or it was
                        # cancelled while queued. It has no log, and it is not a result.
                        (if .conclusion == "cancelled" and ((.steps // []) | length) == 0
                         then "cancelled (never ran)" else .conclusion end),
                        (.check_run_url // "-"),
                        (if .started_at and .completed_at
                         then (.completed_at | fromdate) - (.started_at | fromdate)
                              | "\(. / 60 | floor)m\(. % 60)s"
                         else "?" end),
                        # Last, because it can be empty: `read` collapses empty tab fields.
                        # The step a cancellation killed is `cancelled`, not `failure`:
                        # without it a timed-out job shows no step at all.
                        ([.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled")
                          | .name + (if .conclusion == "cancelled" then " (cancelled)" else "" end)]
                         | join("; "))]
                     | @tsv' > "$OUT/jobs.tsv" 2> "$OUT/jobs.err" \
             && head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha 2>> "$OUT/jobs.err")"; do
            if [ "$attempt" -ge "$attempts" ] || ! grep -q 'HTTP 5[0-9][0-9]' "$OUT/jobs.err"; then
              return 1
            fi
            sleep $((10#$backoff * attempt))
            attempt=$((attempt + 1))
          done
        }
        # This step is context for a Claude job, never a gate: if it fails, every
        # later step of the caller's job is skipped and the Claude run silently
        # never happens. So a failed lookup still writes jobs.md, saying why.
        if ! list_jobs; then
          {
            echo "# CI results — run $run_url"
            echo
            echo "**The run's jobs could not be listed** (gh api exited non-zero), so there are no CI results to read. Run the gates yourself, and say that you did."
            echo
            echo '```'
            cat "$OUT/jobs.err"
            echo '```'
          } > "$index"
          rm -f "$OUT/jobs.tsv" "$OUT/jobs.err"
          echo "::warning title=CI results::the jobs of run $RUN_ID could not be listed"
          echo "collected=0" >> "$GITHUB_OUTPUT"
          cat "$index" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        rm -f "$OUT/jobs.err"
        {
          echo "# CI results — run $run_url"
          echo
          echo "Commit: $head_sha. One log per job in logs/, named by job id."
          echo
          echo "| Job | Conclusion | Failed or cancelled steps | Log |"
          echo "|---|---|---|---|"
        } > "$index"
        # Capture, then match: `gh ... | grep -q` under pipefail reads as "no" when
        # grep exits early and gh dies on SIGPIPE.
        esc=()
        case "$(gh api --help 2>&1)" in
          *--allow-escape-sequences*) esc=(--allow-escape-sequences) ;;
        esac
        n=0; missing=0; never=0; capped=0; unchecked=0
        while IFS=$'\t' read -r id name conclusion check_run took failed; do
          log="$OUT/logs/$id.log"
          # A job cancelled after it started was cancelled by a person, a newer
          # run, or its own timeout-minutes. Only the check run's annotations
          # tell which (the log just says "The operation was canceled."), and
          # reading them needs `checks: read`. Without it the read fails and the
          # job is labelled unchecked, never plain cancelled.
          if [ "$conclusion" = "cancelled" ]; then
            if cap="$(gh api --paginate "$check_run/annotations" \
                        --jq '.[] | select(.message // "" | test("exceeded the maximum execution time")) | .message' 2>/dev/null)"; then
              if [ -n "$cap" ]; then
                conclusion="cancelled (time cap)"
                capped=$((capped + 1))
              fi
            else
              conclusion="cancelled (time cap unchecked, ran $took)"
              unchecked=$((unchecked + 1))
            fi
          fi
          if [ "$conclusion" = "cancelled (never ran)" ]; then
            echo "(no log: this job was cancelled before any of its steps started, so it never ran)" > "$log"
            never=$((never + 1))
          elif ! gh api "${esc[@]}" "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > "$log" 2> "$log.err" || [ ! -s "$log" ]; then
            { echo "(log unavailable: gh api exited non-zero or wrote nothing)"; cat "$log.err"; } > "$log"
            missing=$((missing + 1))
          fi
          rm -f "$log.err"
          echo "| $name | $conclusion | ${failed:--} | logs/$id.log |" >> "$index"
          n=$((n + 1))
        done < "$OUT/jobs.tsv"
        rm -f "$OUT/jobs.tsv"
        if [ "$missing" -gt 0 ]; then
          echo "::warning title=CI results::$missing of $n job logs could not be fetched"
          { echo; echo "**WARNING: $missing of $n job logs could not be fetched** — their files say why. Report those gates as conclusion-only, not as read."; } >> "$index"
        fi
        if [ "$never" -gt 0 ]; then
          echo "::warning title=CI results::$never of $n jobs never ran (cancelled before any step started)"
          { echo; echo "**$never of $n jobs never ran** — cancelled before any step started, so they have no log and no result. That is the runner pool, not the code: \`gh run rerun $RUN_ID --failed\` runs them."; } >> "$index"
        fi
        if [ "$capped" -gt 0 ]; then
          echo "::warning title=CI results::$capped of $n jobs hit their timeout-minutes cap"
          { echo; echo "**$capped of $n jobs hit their \`timeout-minutes\` cap** — the gate exceeded its time budget. That is a finding, not infrastructure: a plain re-run on the same load is likely to time out again."; } >> "$index"
        fi
        if [ "$unchecked" -gt 0 ]; then
          echo "::warning title=CI results::$unchecked of $n cancelled jobs could not be checked for a timeout"
          { echo; echo "**$unchecked of $n jobs were cancelled after they started, and their annotations could not be read** (a token without \`checks: read\` is refused), so a time cap is not ruled out. Compare each one's run time with its job's \`timeout-minutes\` before calling it infrastructure."; } >> "$index"
        fi
        echo "collected=$n" >> "$GITHUB_OUTPUT"
        cat "$index" >> "$GITHUB_STEP_SUMMARY"
