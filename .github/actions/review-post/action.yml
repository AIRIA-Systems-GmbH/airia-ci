name: Post the automatic review
description: >-
  Post Claude's final message as the automatic review: one summary comment with
  the review footer, and one PR comment per finding in its `airia-findings`
  block. Repository-agnostic.

# Why: the review's findings used to live inside one issue comment, so no
# finding had an id, an anchor or a thread that could hold a reply (airia-ci#73).
# The posting itself is post_review.py beside this file. Fails when there is no
# review ("green means posted") or when the findings block is missing or
# malformed.

inputs:
  pr:
    description: The pull request number.
    required: true
  execution-file:
    description: The claude-code-action's execution_file output.
    required: true
  run-id:
    description: The run's id, written into each finding's hidden marker.
    required: true
  run-url:
    description: The run's URL, linked from the summary's footer.
    required: true
  claude-version:
    description: The Claude Code version named in the footer; empty when the action installed its own.
    required: false
    default: ""
  head-sha:
    description: The PR's head commit, which finding comments anchor to; read from the PR when empty.
    required: false
    default: ""
  github-token:
    description: "A token with `pull-requests: write` and `issues: write`."
    required: true

runs:
  using: composite
  steps:
    - name: Post the review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_URL: ${{ inputs.run-url }}
        CLAUDE_VERSION: ${{ inputs.claude-version }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: python3 "$GITHUB_ACTION_PATH/post_review.py" | tee -a "$GITHUB_STEP_SUMMARY"
