name: AIRIA Python toolchain
description: >-
  Provision uv and Python from `.python-version`, install the project with
  `uv sync --locked`, refuse a uv.lock or workflow that undercuts the pinned
  gate tools, and put those tools on PATH at the versions in pins.toml.

# Why: every repository installed its own linters, at its own versions, and an
# unpinned `uv run --with ty` broke SiteBuilder overnight (airia-ci#37). The
# versions live in pins.toml at the root of this repository, read at the tag
# the caller pins; toolchain.py beside this file says which version of a tool
# runs (the locked one, never below the pin, else the pin) and why. Run from
# the root of the caller's checkout. On the Thor pool there is no prebuilt
# CPython for setup-python, so uv provides the interpreter.

inputs:
  python-version:
    description: The interpreter to provision; empty means the first line of `.python-version`.
    required: false
    default: ""
  type-checker:
    description: "`pyright` or `mypy-strict` (the latter only where pins.toml allows it)."
    required: false
    default: pyright
  coverage-floor:
    description: The coverage floor the caller asks for; refused under the standard's.
    required: false
    default: "90"
  debt-ratchet:
    description: >-
      `true` holds the gates to `.airia/debt-baseline.json` (design/gate-debt-ratchet.md): the coverage
      floor may then come from the file, and the file is checked. The `coverage` section and the dates
      are enforced, and `types` is enforced for pyright by the gate's type-check step (mypy-strict with a
      `types` section fails); `tests` is enforced by the gate's pytest step (every failing id must be in the file).
    required: false
    default: "false"
  tools:
    description: >-
      The gate tools to put on PATH, space-separated, from ruff, pyright, reuse,
      pip-audit, zizmor and gitleaks.
    required: false
    default: ""
  services:
    description: >-
      `toJSON(job.services)` of a job with the gate's `postgres` / `qdrant`
      service slots; their addresses are exported as CI_POSTGRES_DSN and
      CI_QDRANT_URL.
    required: false
    default: ""
  job-env:
    description: >-
      KEY=VALUE lines exported to the rest of the job; a value may name
      $CI_POSTGRES_DSN or $CI_QDRANT_URL.
    required: false
    default: ""
  sync:
    description: "`true` installs the project (`uv sync --locked`); a job that only reads the lock passes `false`."
    required: false
    default: "true"
  uv-sync-args:
    description: >-
      Extra arguments for `uv sync --locked`, e.g. `--extra dev --group test`. Allowed: `--extra`,
      `--no-extra`, `--group`, `--only-group`, `--no-group`, `--no-install-package` (as `--name value` or
      `--name=value`; letters, digits, `.`, `_` and `-`), and `--all-extras`, `--all-groups`, `--no-dev`,
      `--no-default-groups`, `--no-install-project`, `--no-install-workspace`. Anything else fails, also
      with `sync: false`. Empty (the default): none.
    required: false
    default: ""
  rust-sdist-build:
    description: >-
      `true` prepares the build of a dependency shipped as an sdist with Rust before the sync: CARGO_TARGET_DIR
      on the runner's cache volume (else in the workspace), release builds without LTO at opt-level 1.
    required: false
    default: "false"

outputs:
  python:
    description: The interpreter version provisioned.
    value: ${{ steps.standard.outputs.python }}
  coverage-floor:
    description: The coverage floor to hold when `debt-ratchet` is true; empty otherwise (use the input).
    value: ${{ steps.standard.outputs.coverage-floor }}

runs:
  using: composite
  steps:
    - name: Check the inputs against the standard
      id: standard
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        TYPE_CHECKER: ${{ inputs.type-checker }}
        COVERAGE_FLOOR: ${{ inputs.coverage-floor }}
        DEBT_RATCHET: ${{ inputs.debt-ratchet }}
      run: python3 "$GITHUB_ACTION_PATH/toolchain.py" standard

    - name: Check the debt baseline
      if: inputs.debt-ratchet == 'true'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/debt.py" check

    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: ${{ steps.standard.outputs.uv }}
        python-version: ${{ steps.standard.outputs.python }}
        # On the Thor pool UV_CACHE_DIR is the runner's persistent volume.
        enable-cache: false

    # No `sync` condition: a bad value fails the security job too, which still runs on a docs-only PR.
    - name: Check the sync arguments
      shell: bash
      env:
        UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
      run: |
        # Only the options that pick what is installed. Any other could move the sync off the project, lock or
        # interpreter this job checked (--project, --directory, --no-config, --python, --managed-python).
        read -ra args <<< "$(tr '\n' ' ' <<< "$UV_SYNC_ARGS")"
        valued='--(extra|no-extra|group|only-group|no-group|no-install-package)'
        flag='--(all-extras|all-groups|no-dev|no-default-groups|no-install-project|no-install-workspace)'
        value='[A-Za-z0-9_][A-Za-z0-9._-]*'
        takes_value=false
        for arg in "${args[@]}"; do
          if [[ "$arg" =~ ^$valued$ ]]; then
            takes_value=true
          elif [[ "$arg" =~ ^($flag|$valued=$value)$ ]]; then
            takes_value=false
          elif [ "$takes_value" = true ] && [[ "$arg" =~ ^$value$ ]]; then
            takes_value=false
          else
            echo "::error title=uv-sync-args::refused: '$arg'. Allowed, as --name value or --name=value: --extra, --no-extra, --group, --only-group, --no-group, --no-install-package; without a value: --all-extras, --all-groups, --no-dev, --no-default-groups, --no-install-project, --no-install-workspace. A value is letters, digits, '.', '_' and '-'."
            exit 1
          fi
        done

    # A step of its own, before the sync: GITHUB_ENV reaches only the later steps.
    - name: Prepare the build of Rust sdists
      if: inputs.rust-sdist-build == 'true' && inputs.sync == 'true'
      shell: bash
      run: |
        # A fat-LTO release build of a Rust sdist (airia-surrealdb) took the Thor pool's shared cgroup to its memory
        # cap (airia-ci#184). uv keeps the built wheel in UV_CACHE_DIR, so each version compiles once.
        root="${CARGO_CACHE_ROOT:-/var/cache/ci}"
        target="$root/cargo-target/${GITHUB_REPOSITORY##*/}"
        # The volume itself is never created: without it there is nothing persistent to build into.
        if ! { [ -d "$root" ] && mkdir -p "$target" && [ -w "$target" ]; }; then
          echo "::notice title=rust-sdist-build::$target is not available (no cache volume, or not writable): building in the workspace"
          target="$GITHUB_WORKSPACE/.cargo-target"
          mkdir -p "$target"
          # Hidden from git, so no later gate reads the build tree as the project's files.
          exclude="$GITHUB_WORKSPACE/.git/info/exclude"
          if [ -d "$GITHUB_WORKSPACE/.git" ] && ! grep -qxF '/.cargo-target/' "$exclude" 2> /dev/null; then
            mkdir -p "$GITHUB_WORKSPACE/.git/info"
            printf '\n/.cargo-target/\n' >> "$exclude"
          fi
        fi
        echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=1" >> "$GITHUB_ENV"
        echo "Rust sdists build in $target, without LTO, at opt-level 1."

    - name: Install the locked project
      if: inputs.sync == 'true'
      shell: bash
      env:
        UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
      run: |
        # Checked above, and split here the same way. Empty adds no argument.
        read -ra args <<< "$(tr '\n' ' ' <<< "$UV_SYNC_ARGS")"
        uv sync --locked "${args[@]}"

    - name: Check uv.lock and the workflows against the pins
      shell: bash
      env:
        TYPE_CHECKER: ${{ inputs.type-checker }}
        PYYAML: ${{ steps.standard.outputs.pyyaml }}
      run: uv run --no-project --with "pyyaml==${PYYAML}" python3 "$GITHUB_ACTION_PATH/toolchain.py" check

    - name: Install the pinned tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: python3 "$GITHUB_ACTION_PATH/toolchain.py" install | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Export the service addresses and the job environment
      if: inputs.services != '' || inputs.job-env != ''
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
        JOB_ENV: ${{ inputs.job-env }}
      run: python3 "$GITHUB_ACTION_PATH/toolchain.py" services
