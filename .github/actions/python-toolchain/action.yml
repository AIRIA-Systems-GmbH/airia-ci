name: AIRIA Python toolchain
description: >-
  Provision uv and Python from `.python-version`, install the project with
  `uv sync --locked`, refuse a uv.lock or workflow that undercuts the pinned
  gate tools, and put those tools on PATH at the versions in pins.toml.

# Why: every repository installed its own linters, at its own versions, and an
# unpinned `uv run --with ty` broke SiteBuilder overnight (airia-ci#37). The
# versions live in pins.toml at the root of this repository, read at the tag
# the caller pins; toolchain.py beside this file says which version of a tool
# runs (the locked one, never below the pin, else the pin) and why. Run from
# the root of the caller's checkout. On the Thor pool there is no prebuilt
# CPython for setup-python, so uv provides the interpreter.

inputs:
  python-version:
    description: The interpreter to provision; empty means the first line of `.python-version`.
    required: false
    default: ""
  type-checker:
    description: "`pyright` or `mypy-strict` (the latter only where pins.toml allows it)."
    required: false
    default: pyright
  coverage-floor:
    description: The coverage floor the caller asks for; refused under the standard's.
    required: false
    default: "90"
  tools:
    description: >-
      The gate tools to put on PATH, space-separated, from ruff, pyright, reuse,
      pip-audit, zizmor and gitleaks.
    required: false
    default: ""
  services:
    description: >-
      `toJSON(job.services)` of a job with the gate's `postgres` / `qdrant`
      service slots; their addresses are exported as CI_POSTGRES_DSN and
      CI_QDRANT_URL.
    required: false
    default: ""
  job-env:
    description: >-
      KEY=VALUE lines exported to the rest of the job; a value may name
      $CI_POSTGRES_DSN or $CI_QDRANT_URL.
    required: false
    default: ""
  sync:
    description: "`true` installs the project (`uv sync --locked`); a job that only reads the lock passes `false`."
    required: false
    default: "true"

outputs:
  python:
    description: The interpreter version provisioned.
    value: ${{ steps.standard.outputs.python }}

runs:
  using: composite
  steps:
    - name: Check the inputs against the standard
      id: standard
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        TYPE_CHECKER: ${{ inputs.type-checker }}
        COVERAGE_FLOOR: ${{ inputs.coverage-floor }}
      run: python3 "$GITHUB_ACTION_PATH/toolchain.py" standard

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ steps.standard.outputs.uv }}
        python-version: ${{ steps.standard.outputs.python }}
        # On the Thor pool UV_CACHE_DIR is the runner's persistent volume.
        enable-cache: false

    - name: Install the locked project
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked

    - name: Check uv.lock and the workflows against the pins
      shell: bash
      env:
        TYPE_CHECKER: ${{ inputs.type-checker }}
        PYYAML: ${{ steps.standard.outputs.pyyaml }}
      run: uv run --no-project --with "pyyaml==${PYYAML}" python3 "$GITHUB_ACTION_PATH/toolchain.py" check

    - name: Install the pinned tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: python3 "$GITHUB_ACTION_PATH/toolchain.py" install | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Export the service addresses and the job environment
      if: inputs.services != '' || inputs.job-env != ''
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
        JOB_ENV: ${{ inputs.job-env }}
      run: python3 "$GITHUB_ACTION_PATH/toolchain.py" services
