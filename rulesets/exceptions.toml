#
# Every repository's departure from rulesets/baseline.json, and why.
# Andrea's ruling 16 (2026-11-19): "ensure all projects have a meaningful shared
# set of rules, and exceptions should only be allowed for very good reasons."
# Nothing is implicit: scripts/rulesets.py fails on any live state that is not
# baseline.json + the exceptions listed here. State read from GitHub 2026-11-19.
#
# Per repository:
#   rulesets         ids of the ruleset that carries the branch rules
#   required_checks  the status-check contexts the ruleset requires (a per-repo field)
#   exceptions       one table per departure; `kind` is one of
#     required_checks  the checks are not the aggregate (none, when the list is empty)
#     omit_rule        the rule `rule` is absent
#     ref_include      the ruleset names `include` instead of ~DEFAULT_BRANCH
#     addition         ruleset `ruleset` is extra: it adds to the baseline, it weakens nothing
#   Each exception has a non-empty `reason`.

# The one status check the shared airia-ci workflow will report. Empty until it exists;
# until then every repository's own list is an exception.
aggregate_check = ""

[repos."AIRIA-Systems-GmbH/AIRIA-process"]
rulesets = [24500238]
required_checks = ["lint", "tests"]
[[repos."AIRIA-Systems-GmbH/AIRIA-process".exceptions]]
kind = "required_checks"
reason = "No aggregate check from the shared airia-ci workflow exists yet; the repository requires its own jobs."
[[repos."AIRIA-Systems-GmbH/AIRIA-process".exceptions]]
kind = "ref_include"
include = ["refs/heads/main"]
reason = "Written as refs/heads/main; the same branch while main is the default. Re-save as ~DEFAULT_BRANCH when the ruleset is next applied."

[repos."AIRIA-Systems-GmbH/AIRIA-framework"]
