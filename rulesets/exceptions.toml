[[repos."AIRIA-Systems-GmbH/AIRIA-framework".exceptions]]
kind = "addition"
ruleset = 25892179
reason = "Release tags (refs/tags/*/v*) are created by the release identity only and never moved or deleted. It adds to the baseline and weakens nothing; its one bypass actor (RepositoryRole 5, admin) is the release path."

