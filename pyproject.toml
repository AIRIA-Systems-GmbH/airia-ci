#
# The smallest project that meets the AIRIA standard: self-test runs the
# python-toolchain action against it, at the PR's own commit.
[project]
name = "airia-fixture"
version = "0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "coverage==7.16.2"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--cov=airia_fixture"
# self-test checks airia-ci out beside this project; its tests are not ours.
testpaths = ["tests"]
