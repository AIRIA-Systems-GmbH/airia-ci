#
# The AIRIA quality standard: the exact version of every gate tool, and the
# floors a project may raise but never lower. The python-toolchain action and
# reusable-python-gate.yml read this file at the tag the caller pins, so a bump
# here reaches every consumer when the tag moves, as its own change, and never
# because a tool shipped a release last night (airia-ci#37).
#
# A tool a project also locks in its own uv.lock runs at the locked version,
# which must not be below the pin here; the gate fails if it is.

[tools]
uv = "0.13.1"
ruff = "0.17.0"
pyright = "1.1.414"
mypy = "2.4.0"
pytest = "9.1.1"
pytest-cov = "7.1.0"
coverage = "7.16.2"
# Not a gate tool: the gate neither installs nor requires it. The dev group of
# templates/python/pyproject.toml pins it, for the `-n auto` in its addopts.
pytest-xdist = "3.8.0"
import-linter = "2.15"
reuse = "6.2.0"
pip-audit = "2.10.1"
zizmor = "1.30.1"
gitleaks = "8.30.1"

# gitleaks is not on PyPI: the release tarball for the runner's platform is
# downloaded and checked against its digest here (from that release's
# gitleaks_<version>_checksums.txt). A platform with no digest is refused.
[gitleaks.sha256]
linux_x64 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
linux_arm64 = "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"

# The harness's own dependency: it parses the caller's workflows.
[harness]
pyyaml = "6.0.3"

[python]
allowed = ["3.12", "3.13", "3.14"]

[standard]
coverage-floor = 90
type-checkers = ["pyright", "mypy-strict"]
# mypy --strict is accepted only where it was already the gate (2026-10-14).
mypy-strict-repositories = ["AIRIA-Systems-GmbH/AIRIA-process"]
# The ruff floor, the `select` of templates/python/pyproject.toml, and the
# `# noqa` baseline (2026-10-15). Until this day (UTC) a narrowed floor or a
# risen suppression count is only a warning, so the release reaches callers
# before they have onboarded; from it on, the lint job fails. A project fails
# early with `[tool.airia] ruff-floor = "error"` in its pyproject.toml.
ruff-floor-error-from = 2026-10-22
